<!DOCTYPE html>
<html lang="en" ng-app="studentApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#4facfe,#00f2fe);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:500px;
height:500px;

background:#ffffff30;

border-radius:50%;

top:-150px;
left:-120px;

filter:blur(80px);

}

body::after{

content:"";

position:absolute;

width:400px;
height:400px;

background:#ffffff20;

border-radius:50%;

bottom:-150px;
right:-100px;

filter:blur(70px);

}

.container{

position:relative;

z-index:10;

width:390px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

border-radius:20px;

padding:35px;

box-shadow:0 20px 50px rgba(0,0,0,.2);

border:1px solid rgba(255,255,255,.2);

animation:fade .6s ease;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

font-size:55px;

text-align:center;

margin-bottom:10px;

}

h2{

text-align:center;

color:white;

margin-bottom:8px;

}

.subtitle{

text-align:center;

color:white;

font-size:14px;

margin-bottom:30px;

opacity:.9;

}

.form-group{

margin-bottom:20px;

}

label{

display:block;

color:white;

margin-bottom:8px;

font-size:14px;

font-weight:600;

}

input{

width:100%;

padding:14px;

border:none;

border-radius:10px;

outline:none;

font-size:15px;

background:white;

}

.password-box{

position:relative;

}

.password-box button{

position:absolute;

right:10px;

top:50%;

transform:translateY(-50%);

border:none;

background:none;

cursor:pointer;

font-size:13px;

font-weight:bold;

color:#0066ff;

}

.options{

display:flex;

justify-content:space-between;

align-items:center;

font-size:14px;

color:white;

margin-bottom:25px;

}

.options a{

color:white;

text-decoration:none;

}

.options a:hover{

text-decoration:underline;

}

.login-btn{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#0066ff;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

background:#004fc5;

transform:translateY(-2px);

}

.login-btn:disabled{

background:gray;

cursor:not-allowed;

}

.error{

font-size:13px;

color:#ffd6d6;

margin-top:5px;

}

.footer{

margin-top:25px;

text-align:center;

color:white;

font-size:14px;

}

.footer a{

color:white;

font-weight:bold;

text-decoration:none;

}

.footer a:hover{

text-decoration:underline;

}

@media(max-width:450px){

.container{

width:90%;

padding:25px;

}

}

</style>

</head>

<body ng-controller="LoginController">

<div class="container">

<div class="logo">🎓</div>

<h2>Student Login</h2>

<p class="subtitle">
College Management System
</p>

<form name="loginForm"
ng-submit="login(loginForm.$valid)"
novalidate>

<div class="form-group">

<label>Student ID</label>

<input
type="text"
name="studentId"
placeholder="Enter Student ID"
ng-model="student.studentId"
required>

<div class="error"
ng-show="loginForm.studentId.$touched && loginForm.studentId.$invalid">

Student ID is required.

</div>

</div>

<div class="form-group">

<label>Password</label>

<div class="password-box">

<input
type="{{showPassword ? 'text' : 'password'}}"
name="password"
placeholder="Enter Password"
ng-model="student.password"
required
minlength="6">

<button
type="button"
ng-click="togglePassword()">

{{showPassword ? 'Hide' : 'Show'}}

</button>

</div>

<div class="error"
ng-show="loginForm.password.$touched && loginForm.password.$error.required">

Password is required.

</div>

<div class="error"
ng-show="loginForm.password.$error.minlength">

Minimum 6 characters.

</div>

</div>

<div class="options">

<label>

<input
type="checkbox"
ng-model="student.remember">

 Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button
class="login-btn"
type="submit"
ng-disabled="loginForm.$invalid">

Login

</button>

</form>

<div class="footer">

Don't have an account?

<a href="#">Contact Admin</a>

</div>

</div>

<script>

var app = angular.module("studentApp", []);

app.controller("LoginController",function($scope){

$scope.student={

studentId:"",
password:"",
remember:false

};

$scope.showPassword=false;

$scope.togglePassword=function(){

$scope.showPassword=!$scope.showPassword;

};

$scope.login=function(valid){

if(valid){

alert(
"Welcome "+$scope.student.studentId+"!"
);

console.log($scope.student);

}

};

});

</script>

</body>
</html>
